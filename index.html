<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de Bord - Groupe Scout</title>
  <style>
    :root {
      --primary-green: #2e7d32;
      --primary-green-dark: #1b5e20;
      --primary-green-light: #e8f5e9;
      --accent-gold: #fbc02d;
      --accent-gold-dark: #f57f17;
      --text-dark: #1b381e;
      --border-green: #a5d6a7;
      --bg-gradient: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 50%, #ded2a8 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: #0f172a;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #c8e6c9;
      box-shadow: 0 20px 25px -5px rgba(46, 125, 50, 0.1);
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-green);
    }

    .app-title {
      margin: 0;
      color: var(--primary-green-dark);
      font-size: 1.6rem;
      font-weight: 800;
    }

    /* Navigation */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.85);
      color: var(--primary-green-dark);
      border: 1px solid var(--border-green);
      padding: 8px 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.825rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .nav-btn.active {
      background: var(--primary-green);
      color: white;
      border: none;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.25);
    }

    .task-counter-badge {
      font-size: 0.85rem;
      color: var(--primary-green-dark);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-green);
    }

    /* Animation de validation */
    @keyframes joyousComplete {
      0% { transform: scale(1) rotate(0deg); background: #ffffff; }
      25% { transform: scale(1.03) rotate(-1deg); background: #dcfce7; border-color: #22c55e; }
      50% { transform: scale(1.01) rotate(1deg); background: #bbf7d0; }
      100% { transform: scale(0.9) translateY(-10px); opacity: 0; height: 0px; margin: 0; padding: 0; }
    }

    .task-card-joyous {
      animation: joyousComplete 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      overflow: hidden;
    }

    /* Formulaire */
    .form-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 14px;
      border: 1px solid var(--border-green);
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.05);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .form-field label {
      display: block;
      font-size: 0.725rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: var(--primary-green-dark);
    }

    .form-field input, .form-field select, .form-field textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-green);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
      border-color: var(--primary-green);
      background: #ffffff;
    }

    /* Layout Grille pour Vue Globale */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .category-column {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-green);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      height: 480px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .column-header {
      background: #f1f8e9;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-green);
      border-top-left-radius: 13px;
      border-top-right-radius: 13px;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .column-body {
      padding: 12px;
      overflow-y: auto;
      flex-grow: 1;
    }

    /* Badges d'importance */
    .badge-urgente { background: #fee2e2; color: #991b1b; }
    .badge-haute { background: #ffedd5; color: #9a3412; }
    .badge-moyenne { background: #fef9c3; color: #854d0e; }
    .badge-basse { background: #f1f5f9; color: #475569; }

    /* Cartes de tâches */
    .task-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 0.875rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    /* Calendrier */
    .calendar-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 24px;
      border-radius: 14px;
      border: 1px solid var(--border-green);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid var(--border-green);
      border-left: 1px solid var(--border-green);
      border-radius: 10px;
      overflow: hidden;
    }

    .calendar-header-day {
      background: #f1f8e9;
      padding: 10px;
      text-align: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--primary-green-dark);
      border-bottom: 1px solid var(--border-green);
      text-transform: uppercase;
    }

    .calendar-day-cell {
      background: white;
      min-height: 95px;
      padding: 8px;
      border-bottom: 1px solid var(--border-green);
      border-right: 1px solid var(--border-green);
      box-sizing: border-box;
      vertical-align: top;
    }

    .calendar-day-cell.is-today {
      background: #f1f8e9 !important;
      border: 2px solid var(--primary-green) !important;
    }

    /* Notifications Popups */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      max-width: 450px;
      width: 90%;
      border: 2px solid var(--primary-green);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }
  </style>

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="app-container">
    <div class="app-header">
      <span style="font-size: 2rem;">⚜️</span>
      <h1 class="app-title">Tableau de Bord & Gestion de Tâches Scout</h1>
    </div>

    <!-- Navigation par Onglets -->
    <div class="nav-header">
      <div class="nav-tabs" id="nav-tabs-container"></div>
      <div class="task-counter-badge" id="task-counter">Actives: 0 • Terminées: 0</div>
    </div>

    <!-- Conteneur Principal -->
    <div id="view-container"></div>
  </div>

  <!-- Conteneur Modal de Rappels -->
  <div id="modal-container"></div>

  <script>
    // Initialize Firebase
    const firebaseConfig = {
      databaseURL: "https://agenda3j-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('scout_agenda_tasks');

    // Dictionnaire des catégories / rôles
    const CATEGORIES = [
      'HM',
      'Chef.fe de branche 1B',
      'Chef.fe de branche 2B',
      'St-ex',
      'Lotus',
      'Post',
      'Meute Avalon',
      'Meute Atlantis',
      'Chef.fe spécifique',
      'Autre'
    ];

    class ScoutAgendaApp {
      constructor() {
        this.currentView = 'dashboard';
        this.editingId = null;
        this.calendarDate = new Date();
        this.tasks = [];

        // Écouteur en temps réel Firebase
        dbRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            this.tasks = Object.keys(data).map(key => ({
              firebaseKey: key,
              ...data[key]
            }));
          } else {
            this.tasks = [];
          }
          this.renderNavTabs();
          this.render();
        }, (error) => {
          console.error("Erreur de lecture Firebase:", error);
        });

        this.init();
      }

      init() {
        this.renderNavTabs();
        this.checkDeadlineReminders();
      }

      saveState() {
        const tasksObj = {};
        this.tasks.forEach(t => {
          const key = t.firebaseKey || dbRef.push().key;
          t.firebaseKey = key;
          const { firebaseKey, ...taskData } = t;
          tasksObj[key] = taskData;
        });
        dbRef.set(tasksObj);
      }

      getRelativeDate(daysOffset) {
        const d = new Date();
        d.setDate(d.getDate() + daysOffset);
        return d.toISOString().split('T')[0];
      }

      formatDate(dateStr) {
        if (!dateStr) return 'Sans deadline';
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }
        return dateStr;
      }

      checkDeadlineReminders() {
        const today = new Date();
        today.setHours(0,0,0,0);
        const notifications = [];

        this.tasks.filter(t => !t.completed && t.deadline).forEach(t => {
          const deadline = new Date(t.deadline);
          deadline.setHours(0,0,0,0);

          const diffDays = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
          const formatted = this.formatDate(t.deadline);

          if (diffDays === 7) {
            notifications.push(`🔔 <b>${t.title}</b> doit être faite dans <b>1 semaine</b> (${formatted})`);
          } else if (diffDays === 3) {
            notifications.push(`⚠️ <b>${t.title}</b> doit être faite dans <b>3 jours</b> (${formatted})`);
          } else if (diffDays === 1) {
            notifications.push(`🚨 <b>${t.title}</b> doit être faite <b>demain</b> (${formatted})`);
          } else if (diffDays === 0) {
            notifications.push(`🔥 <b>${t.title}</b> doit être faite <b>AUJOURD'HUI !</b>`);
          }
        });

        if (notifications.length > 0) {
          this.showModalPopup(notifications);
        }
      }

      showModalPopup(messages) {
        const container = document.getElementById('modal-container');
        container.innerHTML = `
          <div class="modal-overlay">
            <div class="modal-card">
              <h3 style="margin-top:0; color: #1b5e20;">⏰ Rappels d'Échéances Scouts</h3>
              <ul style="padding-left: 20px; line-height: 1.6; color: #1b381e;">
                ${messages.map(m => `<li style="margin-bottom: 8px;">${m}</li>`).join('')}
              </ul>
              <button onclick="document.getElementById('modal-container').innerHTML=''" style="background: #2e7d32; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; float: right;">Compris !</button>
            </div>
          </div>
        `;
      }

      renderNavTabs() {
        const container = document.getElementById('nav-tabs-container');
        if (!container) return;
        
        let html = `<button onclick="app.switchView('dashboard')" id="nav-dashboard" class="nav-btn ${this.currentView === 'dashboard' ? 'active' : ''}">📊 Vue Globale</button>`;

        CATEGORIES.forEach(cat => {
          const viewKey = 'cat_' + cat.replace(/\s+/g, '_');
          html += `<button onclick="app.switchView('${viewKey}')" id="nav-${viewKey}" class="nav-btn ${this.currentView === viewKey ? 'active' : ''}">${cat}</button>`;
        });

        html += `
          <button onclick="app.switchView('coming-up')" id="nav-coming-up" class="nav-btn ${this.currentView === 'coming-up' ? 'active' : ''}">⏰ Prochaines Échéances</button>
          <button onclick="app.switchView('calendar')" id="nav-calendar" class="nav-btn ${this.currentView === 'calendar' ? 'active' : ''}">📅 Calendrier</button>
          <button onclick="app.switchView('completed')" id="nav-completed" class="nav-btn ${this.currentView === 'completed' ? 'active' : ''}">✅ Terminées</button>
        `;

        container.innerHTML = html;
      }

      switchView(viewName) {
        this.currentView = viewName;
        this.editingId = null;
        this.renderNavTabs();
        this.render();
      }

      render() {
        const container = document.getElementById('view-container');
        if (!container) return;

        const activeCount = this.tasks.filter(t => !t.completed).length;
        const completedCount = this.tasks.filter(t => t.completed).length;
        const counterEl = document.getElementById('task-counter');
        if (counterEl) {
          counterEl.textContent = `Actives: ${activeCount} • Terminées: ${completedCount}`;
        }

        if (this.currentView === 'dashboard') {
          container.innerHTML = this.getDashboardHTML();
        } else if (this.currentView.startsWith('cat_')) {
          const catName = this.currentView.replace('cat_', '').replace(/_/g, ' ');
          container.innerHTML = this.getSingleCategoryPageHTML(catName);
        } else if (this.currentView === 'coming-up') {
          container.innerHTML = this.getComingUpHTML();
        } else if (this.currentView === 'calendar') {
          container.innerHTML = this.getCalendarHTML();
        } else if (this.currentView === 'completed') {
          container.innerHTML = this.getCompletedPageHTML();
        }
      }

      getFormHTML(task = null) {
        const isEdit = task !== null;
        return `
          <div class="form-card">
            <h3 style="margin-top:0; margin-bottom: 16px; color: #1b5e20; font-size: 1.05rem;">
              ${isEdit ? '✏️ Modifier la Tâche' : '➕ Ajouter une nouvelle tâche'}
            </h3>
            <form id="task-form" class="form-grid" onsubmit="event.preventDefault(); app.saveTask(${isEdit ? task.id : 'null'});">
              
              <div class="form-field">
                <label>Nom de la tâche *</label>
                <input type="text" id="task-title" required value="${isEdit ? task.title : ''}" placeholder="ex: Commander la nourriture">
              </div>

              <div class="form-field">
                <label>Qui doit s'en occuper ? *</label>
                <select id="task-category">
                  ${CATEGORIES.map(cat => `<option value="${cat}" ${isEdit && task.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                </select>
              </div>

              <div class="form-field">
                <label>Responsable (pas dans la liste)</label>
                <input type="text" id="task-assignee" value="${isEdit && task.assignee ? task.assignee : ''}" placeholder="ex: Akela, Baloo...">
              </div>

              <div class="form-field">
                <label>Importance de cette tâche</label>
                <select id="task-importance">
                  <option value="Basse" ${isEdit && task.importance === 'Basse' ? 'selected' : ''}>Basse</option>
                  <option value="Moyenne" ${isEdit && task.importance === 'Moyenne' ? 'selected' : ''}>Moyenne</option>
                  <option value="Haute" ${isEdit && task.importance === 'Haute' ? 'selected' : ''}>Haute</option>
                  <option value="Urgente" ${isEdit && task.importance === 'Urgente' ? 'selected' : ''}>Urgente</option>
                </select>
              </div>

              <div class="form-field">
                <label>Deadline</label>
                <input type="date" id="task-deadline" value="${isEdit ? task.deadline : ''}">
              </div>

              <div class="form-field" style="grid-column: 1 / -1;">
                <label>Description de la tâche</label>
                <textarea id="task-desc" placeholder="Détails, liens utiles, remarques..." style="height: 60px;">${isEdit ? task.desc : ''}</textarea>
              </div>

              <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px;">
                ${isEdit ? `<button type="button" onclick="app.cancelEdit()" style="background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; padding: 10px 20px; font-weight: 600; border-radius: 8px; cursor: pointer;">Annuler</button>` : ''}
                <button type="submit" style="background: #2e7d32; color: white; border: none; padding: 10px 24px; font-weight: 600; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 4px rgba(46, 125, 50, 0.2);">${isEdit ? 'Mettre à jour' : 'Ajouter la tâche'}</button>
              </div>
            </form>
          </div>
        `;
      }

      getDashboardHTML() {
        return `
          ${this.editingId ? this.getFormHTML(this.tasks.find(t => t.id === this.editingId)) : this.getFormHTML()}
          <div class="dashboard-grid">
            ${CATEGORIES.map(cat => this.renderCategoryColumn(cat)).join('')}
          </div>
        `;
      }

      renderCategoryColumn(cat) {
        const catTasks = this.tasks
          .filter(t => t.category === cat && !t.completed)
          .sort((a, b) => {
            if (!a.deadline) return 1;
            if (!b.deadline) return -1;
            return new Date(a.deadline) - new Date(b.deadline);
          });

        return `
          <div class="category-column">
            <div class="column-header">
              <span>${cat}</span>
              <span style="background: #e8f5e9; color: #1b5e20; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem;">${catTasks.length}</span>
            </div>
            <div class="column-body">
              ${catTasks.length === 0 ? `<p style="color: #66bb6a; text-align: center; margin-top: 40px; font-size: 0.85rem;">Aucune tâche en attente.</p>` : catTasks.map(t => this.renderTaskCard(t)).join('')}
            </div>
          </div>
        `;
      }

      renderTaskCard(t) {
        const badgeClass = `badge-${t.importance.toLowerCase()}`;
        let cardBg = '#ffffff';
        let borderStyle = '1px solid #a5d6a7';
        let statusBadge = '';

        if (!t.completed && t.deadline) {
          const today = new Date();
          today.setHours(0,0,0,0);
          const deadlineDate = new Date(t.deadline);
          deadlineDate.setHours(0,0,0,0);

          const diffDays = Math.ceil((deadlineDate - today) / (1000 * 60 * 60 * 24));

          if (diffDays < 0) {
            borderStyle = '2px solid #ef4444';
            statusBadge = '<span style="color: #ef4444; font-weight: 700; font-size: 0.7rem; margin-left: 6px;">EN RETARD</span>';
          } else if (diffDays === 0) {
            cardBg = '#f0fdf4';
            borderStyle = '2px solid #22c55e';
            statusBadge = '<span style="color: #16a34a; font-weight: 700; font-size: 0.7rem; margin-left: 6px;">AUJOURD\'HUI</span>';
          } else if (diffDays <= 3) {
            borderStyle = '2px solid #f59e0b';
            statusBadge = '<span style="color: #d97706; font-weight: 700; font-size: 0.7rem; margin-left: 6px;">SOUS PEU</span>';
          }
        }

        return `
          <div id="task-card-${t.id}" class="task-card" style="background: ${cardBg}; border: ${borderStyle};">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="app.animateAndToggle(${t.id})" style="cursor: pointer; width: 16px; height: 16px; accent-color: #2e7d32;">
                <strong style="color: #1b381e; font-weight: 600; ${t.completed ? 'text-decoration: line-through;' : ''}">${t.title}</strong>
                ${statusBadge}
              </div>
              <span class="${badgeClass}" style="font-size: 0.65rem; padding: 2px 8px; border-radius: 12px; font-weight: 700;">${t.importance}</span>
            </div>

            ${t.assignee ? `<div style="font-size: 0.75rem; color: #1b5e20; font-weight: 600; margin-left: 24px;">👤 Responsable: ${t.assignee}</div>` : ''}
            ${t.desc ? `<p style="margin: 6px 0 6px 24px; color: #2e4a31; font-size: 0.8rem; line-height: 1.4;">${t.desc}</p>` : ''}
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.75rem; color: #2e7d32; padding-left: 24px; border-top: 1px dashed #e8f5e9; padding-top: 6px;">
              <span>📅 ${this.formatDate(t.deadline)}</span>
              <div>
                ${!t.completed ? `<button onclick="app.startEdit(${t.id})" style="background: none; border: none; color: #2e7d32; cursor: pointer; font-size: 0.75rem; font-weight: 600; margin-right: 8px;">Modifier</button>` : ''}
                <button onclick="app.deleteTask(${t.id})" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.75rem; font-weight: 600;">Supprimer</button>
              </div>
            </div>
          </div>
        `;
      }

      getSingleCategoryPageHTML(catName) {
        const catTasks = this.tasks
          .filter(t => t.category === catName && !t.completed)
          .sort((a, b) => {
            if (!a.deadline) return 1;
            if (!b.deadline) return -1;
            return new Date(a.deadline) - new Date(b.deadline);
          });

        return `
          <div style="background: rgba(255, 255, 255, 0.95); padding: 24px; border-radius: 14px; border: 1px solid var(--border-green);">
            <h2 style="margin-top: 0; color: #1b5e20;">Tâches : ${catName}</h2>
            <p style="color: #2e7d32; font-size: 0.875rem; margin-bottom: 20px;">Toutes les tâches en cours assignées à ${catName}.</p>
            ${catTasks.length === 0 ? `<p style="color: #66bb6a; text-align: center; padding: 50px;">Aucune tâche en cours pour cette catégorie.</p>` : catTasks.map(t => this.renderTaskCard(t)).join('')}
          </div>
        `;
      }

      getCompletedPageHTML() {
        const completedTasks = this.tasks
          .filter(t => t.completed)
          .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

        return `
          <div style="background: rgba(255, 255, 255, 0.95); padding: 24px; border-radius: 14px; border: 1px solid var(--border-green);">
            <h2 style="margin-top: 0; color: #1b5e20;">🎉 Archives des Tâches Terminées</h2>
            <p style="color: #2e7d32; font-size: 0.875rem; margin-bottom: 20px;">Historique des tâches accomplies par l'équipe.</p>
            ${completedTasks.length === 0 ? `<p style="color: #66bb6a; text-align: center; padding: 50px;">Aucune tâche terminée pour le moment.</p>` : completedTasks.map(t => `
              <div style="display: flex; justify-content: space-between; align-items: center; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 14px; border-radius: 10px; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                  <input type="checkbox" checked onchange="app.toggleComplete(${t.id})" style="cursor: pointer; width: 16px; height: 16px; accent-color: #16a34a;">
                  <div>
                    <span style="font-size: 0.7rem; background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 12px; font-weight: 700; margin-right: 8px;">${t.category}</span>
                    <strong style="text-decoration: line-through; color: #15803d;">${t.title}</strong>${t.assignee ? `<span style="color: #475569; font-size: 0.8rem; margin-left: 6px;">(Par: ${t.assignee})</span>` : ''}
                  </div>
                </div>
                <div style="font-size: 0.75rem; color: #16a34a; text-align: right;">
                  <span>Terminée le : ${t.completedAt ? new Date(t.completedAt).toLocaleDateString() : 'Récemment'}</span>
                  <button onclick="app.deleteTask(${t.id})" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.75rem; font-weight: 600; margin-left: 12px;">Supprimer</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      getComingUpHTML() {
        const sortedTasks = [...this.tasks]
          .filter(t => !t.completed && t.deadline)
          .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

        const todayStr = new Date().toISOString().split('T')[0];

        return `
          <div style="background: rgba(255, 255, 255, 0.95); padding: 24px; border-radius: 14px; border: 1px solid var(--border-green);">
            <h2 style="margin-top: 0; color: #1b5e20;">⏰ Prochaines Échéances</h2>
            <p style="color: #2e7d32; font-size: 0.875rem; margin-bottom: 20px;">Toutes les tâches classées par date de rendu imminente.</p>
            ${sortedTasks.length === 0 ? `<p style="color: #66bb6a; text-align: center; padding: 50px;">Aucune tâche avec échéance programmée.</p>` : sortedTasks.map(t => {
              const isOverdue = t.deadline < todayStr;
              const isToday = t.deadline === todayStr;

              let cardBg = '#faf5ff';
              let cardBorder = '1px solid var(--border-green)';
              let dateBg = '#fffbeb';
              let dateColor = '#d97706';
              let dateBorder = '1px solid #fef3c7';
              let statusLabel = '';

              if (isOverdue) {
                cardBg = '#fee2e2';
                cardBorder = '1px solid #fecaca';
                dateBg = '#fef2f2';
                dateColor = '#dc2626';
                dateBorder = '1px solid #fca5a5';
                statusLabel = '<span style="color: #dc2626; font-weight: 700; font-size: 0.7rem; margin-left: 8px;">EN RETARD</span>';
              } else if (isToday) {
                cardBg = '#f0fdf4';
                cardBorder = '1px solid #bbf7d0';
                dateBg = '#dcfce7';
                dateColor = '#15803d';
                dateBorder = '1px solid #86efac';
                statusLabel = '<span style="color: #16a34a; font-weight: 700; font-size: 0.7rem; margin-left: 8px;">AUJOURD\'HUI</span>';
              }

              return `
                <div style="display: flex; justify-content: space-between; align-items: center; background: ${cardBg}; border:${cardBorder}; padding: 14px; border-radius: 10px; margin-bottom: 10px;">
                  <div>
                    <span style="font-size: 0.7rem; background: ${isOverdue ? '#fee2e2' : isToday ? '#dcfce7' : '#e8f5e9'}; color: ${isOverdue ? '#991b1b' : isToday ? '#166534' : '#1b5e20'}; padding: 3px 8px; border-radius: 12px; font-weight: 700; margin-right: 10px;">${t.category}</span>
                    <strong style="color: #1b381e;">${t.title}</strong>${t.assignee ? `<span style="color: #2e7d32; font-size: 0.8rem; margin-left: 6px;">(${t.assignee})</span>` : ''}
                    ${statusLabel}
                  </div>
                  <div style="font-weight: 700; color: ${dateColor}; font-size: 0.875rem; background: ${dateBg}; padding: 4px 10px; border-radius: 6px; border:${dateBorder};">
                    📅 ${this.formatDate(t.deadline)}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      getCalendarHTML() {
        const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        const year = this.calendarDate.getFullYear();
        const month = this.calendarDate.getMonth();

        const todayObj = new Date();
        const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

        let gridHTML = '';
        const headerTitle = `${monthNames[month]} ${year}`;
        
        const firstDayOfMonthObj = new Date(year, month, 1);
        let firstDayOfWeek = firstDayOfMonthObj.getDay(); 
        let distanceToMon = (firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1);

        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const dayHeaders = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
        dayHeaders.forEach(d => {
          gridHTML += `<div class="calendar-header-day">${d}</div>`;
        });

        for (let i = 0; i < distanceToMon; i++) {
          gridHTML += `<div class="calendar-day-cell" style="background: rgba(241, 248, 233, 0.3);"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const formattedDay = String(day).padStart(2, '0');
          const formattedMonth = String(month + 1).padStart(2, '0');
          const dateStr = `${year}-${formattedMonth}-${formattedDay}`;
          const isToday = (dateStr === todayStr);
          const dayTasks = this.tasks.filter(t => t.deadline === dateStr && !t.completed);

          gridHTML += `
            <div class="calendar-day-cell ${isToday ? 'is-today' : ''}">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <span style="font-size: 0.75rem; font-weight: 700; color: ${isToday ? '#2e7d32' : '#1b5e20'};">${day}</span>
                ${isToday ? '<span style="font-size: 0.55rem; background: #2e7d32; color: white; padding: 1px 4px; border-radius: 4px; font-weight: 700;">AUJ</span>' : ''}
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px;">
                ${dayTasks.map(t => `
                  <div style="background: #e8f5e9; color: #1b5e20; font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700;" title="${t.title}">• ${t.title}</div>
                `).join('')}
              </div>
            </div>
          `;
        }

        return `
          <div class="calendar-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h2 style="margin: 0; color: #1b5e20;">📅 ${headerTitle}</h2>
              <div>
                <button onclick="app.changeMonth(-1)" style="background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">&larr; Précédent</button>
                <button onclick="app.changeMonth(1)" style="background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 6px;">Suivant &rarr;</button>
              </div>
            </div>
            <div class="calendar-grid">
              ${gridHTML}
            </div>
          </div>
        `;
      }

      changeMonth(direction) {
        this.calendarDate.setMonth(this.calendarDate.getMonth() + direction);
        this.render();
      }

      saveTask(id = null) {
        const title = document.getElementById('task-title').value;
        const category = document.getElementById('task-category').value;
        const assignee = document.getElementById('task-assignee').value;
        const importance = document.getElementById('task-importance').value;
        const deadline = document.getElementById('task-deadline').value;
        const desc = document.getElementById('task-desc').value;

        if (id !== null) {
          const index = this.tasks.findIndex(t => t.id === id);
          if (index !== -1) {
            this.tasks[index] = { ...this.tasks[index], title, category, assignee, importance, deadline, desc };
          }
        } else {
          const newId = this.tasks.length > 0 ? Math.max(...this.tasks.map(t => t.id || 0)) + 1 : 1;
          this.tasks.push({
            id: newId,
            title,
            category,
            assignee,
            importance,
            deadline,
            desc,
            completed: false,
            completedAt: null
          });
        }

        this.editingId = null;
        this.saveState();
      }

      startEdit(id) {
        this.editingId = id;
        this.render();
      }

      cancelEdit() {
        this.editingId = null;
        this.render();
      }

      deleteTask(id) {
        if (confirm("Voulez-vous vraiment supprimer cette tâche ?")) {
          this.tasks = this.tasks.filter(t => t.id !== id);
          this.saveState();
        }
      }

      animateAndToggle(id) {
        const task = this.tasks.find(t => t.id === id);
        if (!task) return;

        const card = document.getElementById(`task-card-${id}`);
        if (card && !task.completed) {
          card.classList.add('task-card-joyous');
          setTimeout(() => {
            this.toggleComplete(id);
          }, 500);
        } else {
          this.toggleComplete(id);
        }
      }

      toggleComplete(id) {
        const task = this.tasks.find(t => t.id === id);
        if (task) {
          task.completed = !task.completed;
          task.completedAt = task.completed ? Date.now() : null;
          this.saveState();
        }
      }
    }

    const app = new ScoutAgendaApp();
  </script>
</body>
</html>
